version: '3.8'

services:
  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bus-reservation-backend
    ports:
      - "8082:8080"
    networks:
      - bus-reservation-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/bus-reservation/api/test || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Client Service
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: bus-reservation-client
    environment:
      - API_URL=http://backend:8080/bus-reservation
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bus-reservation-network
    stdin_open: true
    tty: true

networks:
  bus-reservation-network:
    driver: bridge
